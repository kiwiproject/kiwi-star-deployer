version: "2"

linters:
  enable:
    - errcheck      # unhandled errors
    - govet         # same as go vet
    - ineffassign   # assignments whose values are never used
    - staticcheck   # broad static analysis (bugs, performance, style; includes gosimple)
    - unused        # unused code
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
